<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producciones Amelia - Panel de Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; background-color: #f0f2f5; color: #1c1e21; }
        h1 { color: #1877f2; text-align: center; font-size: 28px; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { font-size: 18px; margin-top: 0; color: #65676b; border-bottom: 1px solid #ebedf0; padding-bottom: 10px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: 600; font-size: 14px; }
        textarea, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #1877f2; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #166fe5; }
        button:disabled { background-color: #ccd0d5; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e4e6eb; font-size: 14px; }
        th { background-color: #f8f9fa; color: #65676b; }
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; }
        .Pendiente { background: #e7f3ff; color: #1877f2; }
        .Publicado { background: #e7f8ed; color: #2db85c; }
        .preview-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
        .btn-eliminar { background-color: #f02849; color: white; padding: 6px 10px; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; }
        .btn-eliminar:hover { background-color: #d3213f; }
        @media (max-width: 600px) { th:nth-child(4), td:nth-child(4) { display: none; } }
    </style>
</head>
<body>

    <h1>🚀 Producciones Amelia</h1>
    
    <div class="container">
        <h2>Nueva Promoción</h2>
        <form id="promoForm">
            <div>
                <label>Texto del anuncio</label>
                <textarea id="texto" rows="3" required placeholder="Escribe tu oferta..."></textarea>
            </div>
            <div>
                <label>Imagen</label>
                <input type="file" id="archivo_imagen" accept="image/*">
            </div>
            <button type="submit" id="btnGuardar">Guardar y Enviar</button>
        </form>
    </div>

    <div class="container">
        <h2>Historial</h2>
        <div style="overflow-x: auto;">
            <table id="tablaPromos">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Texto</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qeiymehtsztgzffmwsad.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlaXltZWh0c3p0Z3pmZm13c2FkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyOTcyNjcsImV4cCI6MjA5Njg3MzI2N30.Tan3MKApnt0iUPtKtnYYFkkcQAZGC2LpaWhz3z1CGWU";

        const supabaseCliente = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function obtenerPromociones() {
            const { data, error } = await supabaseCliente
                .from('promociones')
                .select('*')
                .order('id', { ascending: false });

            if (error) return console.error(error);

            const tbody = document.querySelector('#tablaPromos tbody');
            tbody.innerHTML = ''; 

            data.forEach(promo => {
                const fecha = new Date(promo.created_at).toLocaleDateString();
                const fila = document.createElement('tr');
                const foto = promo.url_imagen ? `<img src="${promo.url_imagen}" class="preview-img">` : '---';

                fila.innerHTML = `
                    <td>${foto}</td>
                    <td>${promo.texto_promocion.substring(0, 50)}...</td>
                    <td><span class="badge ${promo.estado}">${promo.estado}</span></td>
                    <td>${fecha}</td>
                    <td><button class="btn-eliminar" onclick="eliminarPromocion(${promo.id}, '${promo.url_imagen}')">Borrar</button></td>
                `;
                tbody.appendChild(fila);
            });
        }

        async function eliminarPromocion(id, urlImagen) {
            if (!confirm('¿Eliminar esta promoción y su imagen permanentemente?')) return;

            // 1. Borrar imagen del Storage si existe
            if (urlImagen && urlImagen !== 'null') {
                const nombreArchivo = urlImagen.split('/').pop();
                await supabaseCliente.storage.from('imagenes-promos').remove([nombreArchivo]);
            }

            // 2. Borrar fila de la tabla
            const { error } = await supabaseCliente.from('promociones').delete().eq('id', id);

            if (error) alert('Error: ' + error.message);
            else obtenerPromociones();
        }

        document.getElementById('promoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            const texto = document.getElementById('texto').value;
            const inputImg = document.getElementById('archivo_imagen');
            
            btn.disabled = true;
            btn.innerText = "Procesando...";

            let urlFinal = null;

            if (inputImg.files.length > 0) {
                const file = inputImg.files[0];
                const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
                
                const { error: upError } = await supabaseCliente.storage
                    .from('imagenes-promos').upload(fileName, file);

                if (!upError) {
                    const { data: urlData } = supabaseCliente.storage
                        .from('imagenes-promos').getPublicUrl(fileName);
                    urlFinal = urlData.publicUrl;
                }
            }

            const { error: insError } = await supabaseCliente.from('promociones')
                .insert([{ texto_promocion: texto, url_imagen: urlFinal }]);

            btn.disabled = false;
            btn.innerText = "Guardar y Enviar";

            if (insError) alert('Error al guardar');
            else {
                document.getElementById('promoForm').reset();
                obtenerPromociones();
            }
        });

        obtenerPromociones();
    </script>
</body>
</html>
